name: lyco hygiene

# lyco 生态架构守则的可执行检查（reusable workflow）
# 来源：docs/ECOSYSTEM_ROADMAP.md 内聚/耦合守则 —— 守则写在文档里会漂，写在 CI 里不会。
#
# 用法（任意生态仓库的 .github/workflows/ci.yml）：
#   jobs:
#     hygiene:
#       uses: lilyco-42/.github/.github/workflows/lyco-hygiene.yml@main
#       with:
#         allow-large-files: "assets/,docs/banner"   # 已豁免的大文件前缀（可选）

on:
  workflow_call:
    inputs:
      allow-large-files:
        description: "已豁免的大文件路径前缀（逗号分隔，前缀匹配）"
        type: string
        default: ""
      large-file-bytes:
        description: "大文件阈值（字节，默认 2MB）"
        type: number
        default: 2097152

jobs:
  hygiene:
    name: hygiene (deps pin + big files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 守则 2：git 依赖必须锁 rev/tag —— branch = main/master 会随上游漂移
      - name: "守则 2: git 依赖必须锁 rev/tag"
        run: |
          if grep -rniE 'git[[:space:]]*=[[:space:]]*"https://github[^"]*"' --include=Cargo.toml . \
             | grep -E 'branch[[:space:]]*=[[:space:]]*"(main|master)"'; then
            echo "::error::发现锁 branch=main/master 的 git 依赖 —— 必须改为 rev/tag（守则 2）"
            exit 1
          fi
          echo "✅ 无 branch=main/master 的 git 依赖"

      # 大文件不入库：资产走 Release attachment / 对象存储（守则：仓库只放源码与小资产）
      - name: "大文件扫描（> 阈值，可豁免）"
        env:
          ALLOW: ${{ inputs.allow-large-files }}
          THRESHOLD: ${{ inputs.large-file-bytes }}
        run: |
          threshold="${THRESHOLD:-2097152}"
          violations=0
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            size="${line%% *}"
            path="${line#* }"
            skip=0
            if [ -n "$ALLOW" ]; then
              IFS=',' read -ra prefixes <<< "$ALLOW"
              for prefix in "${prefixes[@]}"; do
                case "$path" in "$prefix"*) skip=1; break ;; esac
              done
            fi
            if [ "$skip" = "0" ]; then
              echo "::error file=$path::大文件入库（$size bytes > $threshold）—— 走 Release/对象存储"
              violations=1
            fi
          done < <(git ls-files -z | xargs -0 stat -c "%s %n" 2>/dev/null | awk -v t="$threshold" '$1 > t {print}')
          if [ "$violations" = "1" ]; then exit 1; fi
          echo "✅ 无超阈值大文件"
